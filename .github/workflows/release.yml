name: Auto Tag and Release on Merge to Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-tag-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from manifest.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            echo "::error::No se pudo leer la versión de manifest.json"
            exit 1
          fi
          TAG_NAME="v${VERSION}"
          echo "Versión detectada en manifest.json: ${VERSION}"
          echo "Tag a generar: ${TAG_NAME}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Check if Git tag already exists
        id: check_tag
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "El tag ${TAG} ya existe. Omitiendo creación de release (incrementa la versión en manifest.json para publicar una nueva release)."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "El tag ${TAG} es nuevo."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and Push Git Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG}: automatizada desde manifest.json al mergear a main"
          git push origin "$TAG"

      - name: Package extension into clean ZIP
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          ZIP_NAME="videostreamdownloader-v${VERSION}.zip"
          echo "Empaquetando extensión en ${ZIP_NAME}..."
          zip -r "${ZIP_NAME}" manifest.json background.js content.js icons popup offscreen
          echo "ZIP_PATH=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true
          draft: false
          prerelease: false
