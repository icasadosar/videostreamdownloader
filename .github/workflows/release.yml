name: Package and Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=latest" >> $GITHUB_OUTPUT
          fi

      - name: Package extension into clean ZIP
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ZIP_NAME="videostreamdownloader-${VERSION}.zip"
          echo "Embalando extensión en ${ZIP_NAME}..."
          zip -r "${ZIP_NAME}" manifest.json background.js content.js icons popup
          echo "ZIP_PATH=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true
          draft: false
          prerelease: false
